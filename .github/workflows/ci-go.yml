# CI - run Go tests and enforce minimum coverage
name: CI - Go backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # default minimum coverage percentage
  MIN_COVERAGE: 80

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend

  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Download modules
        working-directory: backend
        run: |
          go mod download

      - name: Run tests with coverage
        working-directory: backend
        env:
          EVAL_METRICS_OUT: ${{ github.workspace }}/backend/eval-head.json
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out

      - name: Evaluate retrieval on base branch
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set +e
          git fetch --depth=1 origin "$BASE_REF" || exit 0
          git worktree add /tmp/eval-base FETCH_HEAD || exit 0
          if [ -f /tmp/eval-base/backend/internal/services/eval_test.go ]; then
            cd /tmp/eval-base/backend
            EVAL_METRICS_OUT="$GITHUB_WORKSPACE/backend/eval-base.json" \
              go test ./internal/services/ -run TestEvalRetrieval -count=1
          else
            echo "Base branch has no retrieval harness; treating this PR as the baseline."
          fi

      - name: Retrieval evaluation summary
        if: ${{ always() }}
        working-directory: backend
        run: |
          python3 - <<'PY'
          import json, os

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except FileNotFoundError:
                  return None

          head = load("eval-head.json")
          base = load("eval-base.json")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Retrieval evaluation\n\n")
              if head is None:
                  s.write("No metrics were produced for this run (the eval did not run).\n")
                  raise SystemExit(0)

              k = head["k"]
              rows = [("hit@1", "hit_at_1"), (f"recall@{k}", "recall_at_k"), ("MRR", "mrr")]

              s.write(f"Golden cases: {head['cases']} · search depth k={k}\n\n")
              s.write("| Metric | Base | This PR | Δ |\n")
              s.write("| --- | --- | --- | --- |\n")
              for label, key in rows:
                  pr = head[key]
                  if base is None:
                      s.write(f"| {label} | n/a | {pr:.3f} | \U0001f195 new |\n")
                      continue
                  b = base[key]
                  d = pr - b
                  if abs(d) < 1e-9:
                      arrow = "—"
                  elif d > 0:
                      arrow = f"\U0001f53c +{d:.3f}"
                  else:
                      arrow = f"\U0001f53d {d:.3f}"
                  s.write(f"| {label} | {b:.3f} | {pr:.3f} | {arrow} |\n")

              s.write("\n_Visibility only — the merge gate is the threshold assertion in `TestEvalRetrieval`._\n")
          PY

  coverage:
    name: Check Test Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: backend

      - name: Enforce coverage threshold
        working-directory: backend
        env:
          MIN_COVERAGE: ${{ env.MIN_COVERAGE }}
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "coverage.out not found"
            exit 1
          fi
          # Build ignore/negation regexes from .coverageignore. See backend/.coverageignore for details.
          IGNORE_FILE=".coverageignore"

          glob_to_regex() {
            local pat="$1"
            case "$pat" in
              re:*) printf '%s' "${pat#re:}"; return ;;
            esac

            # Trailing "/" means "this directory, recursively".
            local trailing_slash=0
            case "$pat" in */) trailing_slash=1; pat="${pat%/}" ;; esac

            # Leading "/" anchors to the module root; record and strip it.
            local anchor_root=0
            case "$pat" in /*) anchor_root=1; pat="${pat#/}" ;; esac

            # Escape regex metachars (., +, (, ), {, }, |, ^, $, [, ], \)
            # but leave *, ?, / alone — they are expanded next.
            pat=$(printf '%s' "$pat" | sed -E 's/[].+(){}|^$\\.[]/\\&/g')

            # Expand globs: ** -> .*, * -> [^/]*, ? -> [^/]
            # Use a placeholder so ** isn't eaten by the * rule.
            pat=$(printf '%s' "$pat" \
              | sed -e 's|\*\*|__DOUBLESTAR__|g' \
                    -e 's|\*|[^/]*|g' \
                    -e 's|?|[^/]|g' \
                    -e 's|__DOUBLESTAR__|.*|g')

            local prefix suffix
            if [ "$anchor_root" -eq 1 ]; then
              # module root == first path segment in coverage.out
              prefix='^[^/]+/'
            else
              prefix='(^|/)'
            fi
            if [ "$trailing_slash" -eq 1 ]; then
              suffix='(/|$)'
            else
              suffix=''
            fi
            printf '%s%s%s' "$prefix" "$pat" "$suffix"
          }

          INCLUDES=()
          EXCLUDES=()
          if [ -f "$IGNORE_FILE" ]; then
            while IFS= read -r raw || [ -n "$raw" ]; do
              line="${raw#"${raw%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              case "$line" in ''|\#*) continue ;; esac
              if [ "${line#!}" != "$line" ]; then
                EXCLUDES+=("$(glob_to_regex "${line#!}")")
              else
                INCLUDES+=("$(glob_to_regex "$line")")
              fi
            done < "$IGNORE_FILE"
          fi

          join_alt() { local IFS='|'; printf '%s' "$*"; }
          INCLUDE_RE=""
          EXCLUDE_RE=""
          [ "${#INCLUDES[@]}" -gt 0 ] && INCLUDE_RE=$(join_alt "${INCLUDES[@]}")
          [ "${#EXCLUDES[@]}" -gt 0 ] && EXCLUDE_RE=$(join_alt "${EXCLUDES[@]}")

          echo "Ignore regex:     ${INCLUDE_RE:-<none>}"
          echo "Re-include regex: ${EXCLUDE_RE:-<none>}"

          # Build coverage.filtered.out: keep "mode:" header; drop lines
          # matching INCLUDE_RE unless they also match EXCLUDE_RE.
          head -n1 coverage.out > coverage.filtered.out
          if [ -n "$INCLUDE_RE" ]; then
            if [ -n "$EXCLUDE_RE" ]; then
              tail -n +2 coverage.out \
                | awk -v inc="$INCLUDE_RE" -v exc="$EXCLUDE_RE" \
                    '($0 ~ inc) && !($0 ~ exc) { next } { print }' \
                >> coverage.filtered.out
            else
              tail -n +2 coverage.out | grep -Ev "$INCLUDE_RE" >> coverage.filtered.out
            fi
          else
            tail -n +2 coverage.out >> coverage.filtered.out
          fi
          # Extract total coverage, e.g. "total: (statements) 82.3%"
          total=$(go tool cover -func=coverage.filtered.out | tail -n1 | awk '{print $3}')
          pct=${total%\%}
          echo "Go coverage: $pct%"
          # numeric comparison; fail if below threshold
          if awk "BEGIN {exit !($pct >= ${MIN_COVERAGE})}"; then
            echo "Coverage OK (>= ${MIN_COVERAGE}%)"
          else
            echo "Coverage ${pct}% is below threshold ${MIN_COVERAGE}%"
            exit 1
          fi
